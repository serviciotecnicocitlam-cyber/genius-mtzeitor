<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('imagenes/mago.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Georgia', serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .contenedor-pergamino {
            position: absolute;
            top: 65%; 
            left: 50%;
            transform: translate(-50%, -50%) scaleX(0);
            animation: desenrollarHorizontal 1.2s ease-out forwards;
            transform-origin: center center;
            opacity: 0;
        }

        @keyframes desenrollarHorizontal {
            0% {
                transform: translate(-50%, -50%) scaleX(0.05);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scaleX(1);
                opacity: 1;
            }
        }

        .pergamino {
            width: 600px;
            height: auto;
            background: url('imagenes/pergamino.png') no-repeat center center;
            background-size: contain;
            padding: 100px 50px;
            box-sizing: border-box;
            text-align: center;
            color: #3b2f1f;
        }

        .texto-pergamino h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .texto-pergamino p {
            font-size: 20px;
            margin: 10px 0;
        }

        #btnReiniciar {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 18px;
            font-family: 'Georgia', serif;
            background-color: #d4af37;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
            transition: opacity 0.5s;
        }

        #btnReiniciar:hover {
            background-color: #c49b2d;
        }
    </style>
</head>
<body>

    <div class="contenedor-pergamino">
        <div class="pergamino">
            <div class="texto-pergamino">
                <h1>Resultados</h1>
                <p id="puntaje">Preguntas acertadas:</p>
                <p id="mensajeFinal">🎉 ¡Gracias por participar!</p>

                <button id="btnReiniciar" onclick="reiniciarJuego()">Reiniciar Juego</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const aciertos = parseInt(params.get("aciertos")) || 0;
        const total = parseInt(params.get("total")) || 6;

        document.getElementById("puntaje").textContent =
            `Preguntas acertadas: ${aciertos}/${total}`;

        setTimeout(() => {
            document.getElementById("btnReiniciar").style.display = 'inline-block';
        }, 2000);

        function reiniciarJuego() {
            window.location.href = "../../index.html";
        }
    </script>

</body>
</html>

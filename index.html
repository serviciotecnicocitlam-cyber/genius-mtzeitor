<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mago</title>
     <script src="index.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
     <video autoplay muted loop id="videoespera">
        <source src="espera.mp4" type="video/mp4">
        Tu navegador no soporta este video.
    </video>
    <video autoplay muted id="videointro"  style="display: none;" >
        <source src="videopresentacion.mp4" type="video/mp4">
        Tu navegador no soporta este video.
    </video>
    <div class="esfera">
    <button id="button">¿Quieres jugar?</button>
    </div>
    <script>
const boton = document.getElementById("button");
const intro = document.getElementById("videointro");
const espera = document.getElementById("videoespera");

boton.addEventListener("click", () => {
    // Oculta el video de espera y muestra el de introducción
    espera.style.display = "none";
    intro.style.display = "block";

    // Reproduce el video con sonido
    intro.muted = false;
    intro.play().catch(err => console.warn("No se pudo reproducir:", err));
});
</script>
</body>

</html>
